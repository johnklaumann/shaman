name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20.x, 22.x, 24.x]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit and e2e tests
        run: npm test
      - name: Adapters in sync with rules/core.md
        run: node scripts/build-adapters.mjs --check
      - name: Versions in sync (package, claude plugin, codex plugin)
        run: node scripts/check-versions.mjs
      - name: Gate benchmark regression (100% vague caught, 0 false blocks)
        run: node bench/gate-bench.mjs --ci
      - name: Publishable package sanity (npm pack contents)
        run: npm pack --dry-run
