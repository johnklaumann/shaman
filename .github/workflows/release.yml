name: Release

# Publishes shaman-ai to npm on version tags (v0.2.0, v1.0.0...).
# Requires npm Trusted Publishing configured for this repo
# (npmjs.com -> package -> Settings -> Trusted Publisher -> GitHub Actions),
# so no NPM_TOKEN secret is ever stored.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
      - run: npm test
      - run: node scripts/build-adapters.mjs --check
      - run: npm publish --provenance --access public
