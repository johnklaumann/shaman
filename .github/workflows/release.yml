name: Release

# Tag vX.Y.Z -> full test gate -> GitHub Release.
# REQUIRES: Settings -> Actions -> General -> Workflow permissions ->
# "Read and write permissions". On a fresh repo the default GITHUB_TOKEN is
# read-only, which caps the `contents: write` below and makes `gh release
# create` return HTTP 403.
# npm publish runs as a separate job that is ALLOWED TO FAIL until npm Trusted
# Publishing is configured (npmjs.com -> package -> Settings -> Trusted
# Publisher -> this repo + this workflow). The plugin itself distributes from
# this GitHub repo (Claude Code / Codex marketplaces, npx github:) — npm is the
# optional short-command channel.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm test
      - run: node scripts/build-adapters.mjs --check
      - run: node scripts/check-versions.mjs
      - run: node bench/gate-bench.mjs --ci
      - name: Tag matches package version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then echo "tag v$TAG != package.json $PKG"; exit 1; fi
      - name: GitHub Release with changelog notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md) for details. Install: \`claude plugin marketplace add johnklaumann/shaman\` then \`claude plugin install shaman@shaman\` — or \`npx github:johnklaumann/shaman init\` for other tools."
          # Idempotent: create the release, or update it if a re-run/re-tag already made one.
          gh release create "$GITHUB_REF_NAME" --title "shaman $GITHUB_REF_NAME" --notes "$NOTES" \
            || gh release edit "$GITHUB_REF_NAME" --title "shaman $GITHUB_REF_NAME" --notes "$NOTES"

  npm-publish:
    needs: release
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
      - run: npm publish --provenance --access public
