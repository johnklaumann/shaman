name: Release

# Tag vX.Y.Z -> full test gate -> npm publish with provenance -> GitHub Release.
# npm auth uses Trusted Publishing (OIDC): configure once on npmjs.com
# (package Settings -> Trusted Publisher -> this repo + this workflow); no
# NPM_TOKEN secret is ever stored.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
      - run: npm test
      - run: node scripts/build-adapters.mjs --check
      - run: node scripts/check-versions.mjs
      - run: node bench/gate-bench.mjs --ci
      - name: Tag matches package version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then echo "tag v$TAG != package.json $PKG"; exit 1; fi
      - run: npm publish --provenance --access public
      - name: GitHub Release with changelog notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "shaman $GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md) for details. Install: \`claude plugin install shaman@shaman\` or \`npx shaman-ai init\`."
